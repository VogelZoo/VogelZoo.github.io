<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Progress Tracker</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --border: #e2e8f0;
            --reader-1: #3b82f6;
            --reader-2: #10b981;
            --reader-3: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .book-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .chart-container {
            margin-bottom: 32px;
            background: #fafafa;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .chart-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .comparison-bar-stack {
            display: flex;
            height: 24px;
            background-color: var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .stack-segment {
            height: 100%;
            transition: width 0.4s ease;
        }

        .stack-segment.r1 { background-color: var(--reader-1); }
        .stack-segment.r2 { background-color: var(--reader-2); }
        .stack-segment.r3 { background-color: var(--reader-3); }

        .readers-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .reader-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            background: var(--card-bg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .reader-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .reader-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .rank-badge {
            font-size: 0.8rem;
            font-weight: 700;
            background: #edf2f7;
            padding: 2px 8px;
            border-radius: 20px;
            color: var(--text-main);
        }

        .reader-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: right;
        }

        .pct-display {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1rem;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background-color: var(--primary-light);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="number"] {
            width: 75px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
        }

        button {
            padding: 6px 12px;
            border: none;
            background-color: var(--primary);
            color: white;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📖 Book Club Tracker</h1>
        <div class="book-meta">Tracking Custom Reader Goals</div>
    </header>

    <div class="chart-container">
        <div class="chart-title">Relative Progress Contribution (Based on %)</div>
        <div class="comparison-bar-stack" id="comparison-stack">
            <div class="stack-segment r1" id="stack-r1" style="width: 0%"></div>
            <div class="stack-segment r2" id="stack-r2" style="width: 0%"></div>
            <div class="stack-segment r3" id="stack-r3" style="width: 0%"></div>
        </div>
    </div>

    <div class="readers-list" id="readers-container">
        <!-- Reader Card 1 -->
        <div class="reader-card" id="card-1" data-id="1">
            <div class="reader-header">
                <div class="reader-name-group">
                    <div class="color-dot" style="background-color: var(--reader-1);"></div>
                    <div class="reader-name" contenteditable="true" onblur="saveNames(1)">Reader 1</div>
                    <span class="rank-badge" id="rank-1">1st</span>
                </div>
                <div class="reader-stats">
                    <div class="pct-display" id="pct-1">0%</div>
                    <div><span id="pages-1">0</span> / <span id="total-display-1">500</span> pgs</div>
                </div>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="fill-1" style="background-color: var(--reader-1);"></div>
            </div>
            <div class="controls">
                <div class="input-group">
                    <label for="input-1">Page:</label>
                    <input type="number" id="input-1" min="0" placeholder="Current">
                </div>
                <div class="input-group">
                    <label for="total-1">Total:</label>
                    <input type="number" id="total-1" min="1" placeholder="Max">
                </div>
                <button onclick="updateProgress(1)">Update</button>
                <div style="margin-left: auto; font-size: 0.85rem; color: var(--text-muted);">
                    <span id="rem-1">500</span> left
                </div>
            </div>
        </div>

        <!-- Reader Card 2 -->
        <div class="reader-card" id="card-2" data-id="2">
            <div class="reader-header">
                <div class="reader-name-group">
                    <div class="color-dot" style="background-color: var(--reader-2);"></div>
                    <div class="reader-name" contenteditable="true" onblur="saveNames(2)">Reader 2</div>
                    <span class="rank-badge" id="rank-2">2nd</span>
                </div>
                <div class="reader-stats">
                    <div class="pct-display" id="pct-2">0%</div>
                    <div><span id="pages-2">0</span> / <span id="total-display-2">500</span> pgs</div>
                </div>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="fill-2" style="background-color: var(--reader-2);"></div>
            </div>
            <div class="controls">
                <div class="input-group">
                    <label for="input-2">Page:</label>
                    <input type="number" id="input-2" min="0" placeholder="Current">
                </div>
                <div class="input-group">
                    <label for="total-2">Total:</label>
                    <input type="number" id="total-2" min="1" placeholder="Max">
                </div>
                <button onclick="updateProgress(2)">Update</button>
                <div style="margin-left: auto; font-size: 0.85rem; color: var(--text-muted);">
                    <span id="rem-2">500</span> left
                </div>
            </div>
        </div>

        <!-- Reader Card 3 -->
        <div class="reader-card" id="card-3" data-id="3">
            <div class="reader-header">
                <div class="reader-name-group">
                    <div class="color-dot" style="background-color: var(--reader-3);"></div>
                    <div class="reader-name" contenteditable="true" onblur="saveNames(3)">Reader 3</div>
                    <span class="rank-badge" id="rank-3">3rd</span>
                </div>
                <div class="reader-stats">
                    <div class="pct-display" id="pct-3">0%</div>
                    <div><span id="pages-3">0</span> / <span id="total-display-3">500</span> pgs</div>
                </div>
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="fill-3" style="background-color: var(--reader-3);"></div>
            </div>
            <div class="controls">
                <div class="input-group">
                    <label for="input-3">Page:</label>
                    <input type="number" id="input-3" min="0" placeholder="Current">
                </div>
                <div class="input-group">
                    <label for="total-3">Total:</label>
                    <input type="number" id="total-3" min="1" placeholder="Max">
                </div>
                <button onclick="updateProgress(3)">Update</button>
                <div style="margin-left: auto; font-size: 0.85rem; color: var(--text-muted);">
                    <span id="rem-3">500</span> left
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize tracking data state from LocalStorage or default setup
    let appState = JSON.parse(localStorage.getItem('readingTrackerState')) || {
        readers: {
            1: { current: 0, total: 500, name: "Reader 1" },
            2: { current: 0, total: 500, name: "Reader 2" },
            3: { current: 0, total: 500, name: "Reader 3" }
        }
    };

    function init() {
        // Hydrate DOM inputs and text with existing state data
        for (let id in appState.readers) {
            const reader = appState.readers[id];
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.querySelector('.reader-name').innerText = reader.name;
                document.getElementById(`total-${id}`).value = reader.total;
                document.getElementById(`input-${id}`).value = reader.current || '';
            }
        }
        render();
    }

    function saveNames(id) {
        const card = document.getElementById(`card-${id}`);
        if (card) {
            appState.readers[id].name = card.querySelector('.reader-name').innerText.trim() || `Reader ${id}`;
            saveState();
        }
    }

    function updateProgress(id) {
        const inputEl = document.getElementById(`input-${id}`);
        const totalEl = document.getElementById(`total-${id}`);
        
        let currentVal = parseInt(inputEl.value, 10);
        let totalVal = parseInt(totalEl.value, 10);

        // Validation safeguards
        if (isNaN(totalVal) || totalVal <= 0) totalVal = 100; // Default fallback if broken
        if (isNaN(currentVal) || currentVal < 0) currentVal = 0;
        if (currentVal > totalVal) currentVal = totalVal;

        appState.readers[id].current = currentVal;
        appState.readers[id].total = totalVal;
        
        inputEl.value = currentVal;
        totalEl.value = totalVal;

        saveState();
        render();
    }

    function saveState() {
        localStorage.setItem('readingTrackerState', JSON.stringify(appState));
    }

    function render() {
        const container = document.getElementById('readers-container');
        const readerDataArr = [];

        // 1. Calculate and update individual reader elements
        for (let id in appState.readers) {
            const reader = appState.readers[id];
            const pct = reader.total > 0 ? (reader.current / reader.total) * 100 : 0;
            const remaining = Math.max(0, reader.total - reader.current);

            document.getElementById(`pages-${id}`).innerText = reader.current;
            document.getElementById(`total-display-${id}`).innerText = reader.total;
            document.getElementById(`rem-${id}`).innerText = remaining;
            document.getElementById(`pct-${id}`).innerText = `${pct.toFixed(1)}%`;
            document.getElementById(`fill-${id}`).style.width = `${pct}%`;

            readerDataArr.push({ id: id, pct: pct });
        }

        // 2. Sort metrics hierarchy (Highest percentage first)
        readerDataArr.sort((a, b) => b.pct - a.pct);

        // 3. Re-order elements inside the container DOM according to sorting hierarchy
        readerDataArr.forEach((item, index) => {
            const card = document.getElementById(`card-${item.id}`);
            container.appendChild(card); // Re-appending moves it to the bottom of the stack seamlessly

            // Update visible leaderboard position badges
            const rankSuffixes = ["1st", "2nd", "3rd"];
            document.getElementById(`rank-${item.id}`).innerText = rankSuffixes[index] || `${index + 1}th`;
        });

        // 4. Update upper cumulative graphical bar metrics out of maximum 300% (100% max per person)
        const combinedPctTotal = readerDataArr.reduce((sum, item) => sum + item.pct, 0);
        
        for (let id in appState.readers) {
            const currentPct = readerDataArr.find(item => item.id == id).pct;
            // Scale segments relative to the entire combined progress container pool
            const segmentWidth = combinedPctTotal > 0 ? (currentPct / 300) * 100 : 0;
            document.getElementById(`stack-r${id}`).style.width = `${segmentWidth}%`;
        }
    }

    // Fire application engine initialization
    init();
</script>
</body>
</html>
