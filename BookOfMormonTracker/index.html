<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Progress Tracker</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .book-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .action-bar {
            background: #fafafa;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .action-bar input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .action-bar input[type="text"] {
            flex: 1;
            min-width: 130px;
        }

        .action-bar input[type="number"] {
            width: 90px;
        }

        .chart-container {
            margin-bottom: 32px;
            background: #fafafa;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .chart-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .comparison-bar-stack {
            display: flex;
            height: 24px;
            background-color: var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .stack-segment {
            height: 100%;
            transition: width 0.4s ease;
        }

        .readers-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .reader-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            background: var(--card-bg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .reader-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .reader-name {
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 1px dashed transparent;
        }

        .reader-name:hover {
            border-bottom-color: var(--text-muted);
            cursor: pointer;
        }

        .rank-badge {
            font-size: 0.8rem;
            font-weight: 700;
            background: #edf2f7;
            padding: 2px 8px;
            border-radius: 20px;
            color: var(--text-main);
        }

        .reader-stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: right;
        }

        .pct-display {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1rem;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background-color: var(--primary-light);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .controls input[type="number"] {
            width: 75px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
        }

        button {
            padding: 7px 12px;
            border: none;
            background-color: var(--primary);
            color: white;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📖 Book Club Tracker</h1>
        <div class="book-meta">Tracking Custom Reader Goals</div>
    </header>

    <!-- Controls for Dynamic Member Management -->
    <div class="action-bar">
        <input type="text" id="new-name" placeholder="New Person's Name">
        <input type="number" id="new-total" min="1" placeholder="Book Pages" value="500">
        <button onclick="addPerson()">Add Person</button>
    </div>

    <div class="chart-container">
        <div class="chart-title">Relative Progress Contribution (Based on %)</div>
        <div class="comparison-bar-stack" id="comparison-stack">
            <!-- Dynamically populated stacks -->
        </div>
    </div>

    <div class="readers-list" id="readers-container">
        <!-- Dynamically generated reader cards will be injected here -->
    </div>
</div>

<script>
    // Pallet loop to handle multiple colors gracefully
    const PALETTE = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];

    // Initialize state from LocalStorage or seed defaults
    let appState = JSON.parse(localStorage.getItem('dynamicTrackerState')) || {
        readers: [
            { id: Date.now() + 1, current: 0, total: 531, name: "Reader 1" },
            { id: Date.now() + 2, current: 0, total: 420, name: "Reader 2" },
            { id: Date.now() + 3, current: 0, total: 600, name: "Reader 3" }
        ]
    };

    function addPerson() {
        const nameInput = document.getElementById('new-name');
        const totalInput = document.getElementById('new-total');
        
        const name = nameInput.value.trim() || `Reader ${appState.readers.length + 1}`;
        let total = parseInt(totalInput.value, 10);

        if (isNaN(total) || total <= 0) total = 100;

        appState.readers.push({
            id: Date.now(),
            name: name,
            current: 0,
            total: total
        });

        nameInput.value = '';
        saveState();
        render();
    }

    function removePerson(id) {
        appState.readers = appState.readers.filter(r => r.id !== id);
        saveState();
        render();
    }

    function updateProgress(id) {
        const currentInput = document.getElementById(`input-${id}`);
        const totalInput = document.getElementById(`total-${id}`);
        
        let currentVal = parseInt(currentInput.value, 10);
        let totalVal = parseInt(totalInput.value, 10);

        const reader = appState.readers.find(r => r.id === id);
        if (!reader) return;

        if (isNaN(totalVal) || totalVal <= 0) totalVal = 100;
        if (isNaN(currentVal) || currentVal < 0) currentVal = 0;
        if (currentVal > totalVal) currentVal = totalVal;

        reader.current = currentVal;
        reader.total = totalVal;

        saveState();
        render();
    }

    function updateInlineName(el, id) {
        const reader = appState.readers.find(r => r.id === id);
        if (reader) {
            reader.name = el.innerText.trim() || `Reader`;
            saveState();
        }
    }

    function saveState() {
        localStorage.setItem('dynamicTrackerState', JSON.stringify(appState));
    }

    function render() {
        const container = document.getElementById('readers-container');
        const stackContainer = document.getElementById('comparison-stack');
        
        container.innerHTML = '';
        stackContainer.innerHTML = '';

        if (appState.readers.length === 0) {
            container.innerHTML = '<div class="empty-state">No participants added yet. Add someone above!</div>';
            return;
        }

        // Calculate metadata, percentages, and retain dynamic sorting orders
        const calculatedArr = appState.readers.map((reader, index) => {
            const pct = reader.total > 0 ? (reader.current / reader.total) * 100 : 0;
            const remaining = Math.max(0, reader.total - reader.current);
            const color = PALETTE[index % PALETTE.length];
            return { ...reader, pct, remaining, color };
        });

        // Sort Highest Percentage First
        calculatedArr.sort((a, b) => b.pct - a.pct);

        const rankSuffixes = ["1st", "2nd", "3rd"];
        
        // 1. Build & Append UI Cards
        calculatedArr.forEach((reader, index) => {
            const rankLabel = rankSuffixes[index] || `${index + 1}th`;
            
            const card = document.createElement('div');
            card.className = 'reader-card';
            card.id = `card-${reader.id}`;
            card.innerHTML = `
                <div class="reader-header">
                    <div class="reader-name-group">
                        <div class="color-dot" style="background-color: ${reader.color};"></div>
                        <div class="reader-name" contenteditable="true" onblur="updateInlineName(this, ${reader.id})">${reader.name}</div>
                        <span class="rank-badge">${rankLabel}</span>
                    </div>
                    <div class="reader-stats">
                        <div class="pct-display">${reader.pct.toFixed(1)}%</div>
                        <div><span>${reader.current}</span> / <span>${reader.total}</span> pgs</div>
                    </div>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: ${reader.pct}%; background-color: ${reader.color};"></div>
                </div>
                <div class="controls">
                    <div class="input-group">
                        <label>Page:</label>
                        <input type="number" id="input-${reader.id}" min="0" value="${reader.current}">
                    </div>
                    <div class="input-group">
                        <label>Total:</label>
                        <input type="number" id="total-${reader.id}" min="1" value="${reader.total}">
                    </div>
                    <button onclick="updateProgress(${reader.id})">Update</button>
                    <button class="btn-danger" onclick="removePerson(${reader.id})">Remove</button>
                    <div style="margin-left: auto; font-size: 0.85rem; color: var(--text-muted);">
                        <span>${reader.remaining}</span> left
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        // 2. Build Top Global Comparison Stack Graphics
        const totalProgressPool = calculatedArr.reduce((sum, r) => sum + r.pct, 0);
        const maxPoolScale = calculatedArr.length * 100; // 100% capacity pool per user

        calculatedArr.forEach(reader => {
            const segmentWidth = maxPoolScale > 0 ? (reader.pct / maxPoolScale) * 100 : 0;
            if (segmentWidth > 0) {
                const segment = document.createElement('div');
                segment.className = 'stack-segment';
                segment.style.width = `${segmentWidth}%`;
                segment.style.backgroundColor = reader.color;
                segment.title = `${reader.name}: ${reader.pct.toFixed(1)}%`;
                stackContainer.appendChild(segment);
            }
        });
    }

    // Run DOM generation
    render();
</script>
</body>
</html>
