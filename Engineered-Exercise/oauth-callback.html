<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting…</title>
    <style>
        body {
            background-color: #121214;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 1.5rem;
        }
        .spinner {
            width: 28px; height: 28px;
            border: 3px solid #374151;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #9ca3af; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div>
        <div class="spinner"></div>
        <p>Finishing connection…</p>
    </div>
    <script>
        // This page only exists to receive the OAuth redirect (Dropbox needs a
        // real page redirect, unlike Google's popup-based token flow). It just
        // forwards the auth code/state straight back to the main app, which
        // does the actual token exchange in backup.js.
        (function () {
            var params = window.location.search; // e.g. "?code=...&state=dropbox"
            window.location.replace("./index.html" + params);
        })();
    </script>
</body>
</html>
