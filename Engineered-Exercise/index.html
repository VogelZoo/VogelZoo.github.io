<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engineered Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Engineered Exercise</h1>
        <nav>
            <button onclick="switchView('track')" class="nav-btn active" id="nav-track">Track</button>
            <button onclick="switchView('plan')" class="nav-btn" id="nav-plan">Plan</button>
            <button onclick="switchView('stats')" class="nav-btn" id="nav-stats">Stats</button>
            <button onclick="switchView('settings')" class="nav-btn" id="nav-settings">Data</button>
        </nav>
    </header>

    <main class="container">
        <section id="view-track" class="view">
            <div class="card suggestion-box" id="today-suggestion"></div>

            <div class="card">
                <h3>7-Day Horizon</h3>
                <div class="calendar-horizon" id="calendar-horizon-view"></div>
            </div>

            <div class="card">
                <h2 id="form-title">Log Exercise</h2>
                <form id="log-form">
                    <input type="hidden" id="edit-entry-id" value="">
                    
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
                        <div class="form-group" style="flex: 1; min-width: 130px; margin-bottom: 0;">
                            <label for="log-date">Date</label>
                            <input type="date" id="log-date" required style="width: 100%; box-sizing: border-box;">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 130px; margin-bottom: 0;">
                            <label for="log-intensity">Intensity</label>
                            <select id="log-intensity" style="width: 100%; box-sizing: border-box;">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="exercise-select">Exercise</label>
                        <select id="exercise-select" required></select>
                    </div>

                    <div id="dynamic-fields-container"></div>

                    <div class="form-row" id="form-action-buttons">
                        <button type="submit" class="btn btn-primary" id="submit-log-btn">Save Entry</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="view-plan" class="view hidden">
            <div class="card">
                <h2>Schedule Your Routine</h2>
                <form id="plan-form">
                    <div class="form-group">
                        <label for="plan-exercise">Exercise</label>
                        <select id="plan-exercise" required></select>
                    </div>
                    <div class="form-group">
                        <label for="schedule-type">Schedule Type</label>
                        <select id="schedule-type" onchange="toggleScheduleInputs()">
                            <option value="weekly">Day of Week</option>
                            <option value="interval">Interval (Days)</option>
                        </select>
                    </div>
                    <div id="weekly-inputs" class="form-group">
                        <label for="plan-day">Day</label>
                        <select id="plan-day">
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                            <option value="6">Saturday</option>
                            <option value="0">Sunday</option>
                        </select>
                    </div>
                    <div id="interval-inputs" class="form-group hidden">
                        <div class="form-row">
                            <div>
                                <label for="plan-interval">Every X Days</label>
                                <input type="number" id="plan-interval" min="1" placeholder="3">
                            </div>
                            <div>
                                <label for="plan-start-date">Start Date</label>
                                <input type="date" id="plan-start-date">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Add to Plan</button>
                </form>
            </div>

            <div class="card">
                <h3>Organized Schedule</h3>
                <div id="organized-plan-view"></div>
            </div>
        </section>

        <section id="view-stats" class="view hidden">
            <div class="card">
                <h2>Progress Insight Charts</h2>
                <div class="form-group" id="chart-filter-wrapper">
                    <label for="chart-exercise-select">Filter Chart by Exercise</label>
                    <select id="chart-exercise-select" onchange="renderStats()"></select>
                </div>
                <div id="graph-container"></div>
                
                <div class="legend-container" id="chart-legend" style="display:none; margin-top:0.5rem; justify-content:center; gap:1rem; font-size:0.7rem;">
                    <span><span class="legend-dot" style="background-color:#4b5563;"></span> Light</span>
                    <span><span class="legend-dot" style="background-color:#d97706;"></span> Medium</span>
                    <span><span class="legend-dot" style="background-color:#dc2626;"></span> Heavy</span>
                    <span><span class="legend-dot" style="background-color:#2563eb;"></span> None</span>
                </div>
                
                <div id="stats-summary" style="margin-top: 1rem;"></div>

                <div id="stacked-bar-charts-container" style="margin-top: 1.25rem;"></div>
            </div>
            <div class="card">
                <h3>History Logs By Day</h3>
                <div id="history-grouped-container"></div>
            </div>
        </section>

        <section id="view-settings" class="view hidden">
            <div class="card">
                <h2>Add Custom Exercise</h2>
                <form id="custom-exercise-form">
                    <div class="form-group">
                        <label for="new-ex-name">Name</label>
                        <input type="text" id="new-ex-name" required placeholder="e.g., Romanian Deadlift">
                    </div>
                    <div class="form-group">
                        <label for="new-ex-category">Category</label>
                        <select id="new-ex-category">
                            <option value="Strength">Strength</option>
                            <option value="Core">Core</option>
                            <option value="Cardio">Cardio</option>
                            <option value="Mobility/Yoga">Mobility/Yoga</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Metrics to Track:</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-label"><input type="checkbox" name="metric" value="sets"> Sets</label>
                            <label class="checkbox-label"><input type="checkbox" name="metric" value="reps"> Reps</label>
                            <label class="checkbox-label"><input type="checkbox" name="metric" value="weight"> Weight</label>
                            <label class="checkbox-label"><input type="checkbox" name="metric" value="timeSeconds"> Time (Secs)</label>
                            <label class="checkbox-label"><input type="checkbox" name="metric" value="timeMinutes"> Time (Mins)</label>
                            <label class="checkbox-label"><input type="checkbox" name="metric" value="distance"> Distance</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Exercise</button>
                </form>
            </div>

            <div class="card">
                <h2>Manage App Data</h2>
                <p class="text-muted">Backup your data or import history from another device.</p>
                <div class="form-row" style="grid-template-columns: 1fr; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <button onclick="exportCSV()" class="btn btn-success">Export History Log (CSV)</button>
                </div>
                <div class="form-row">
                    <button onclick="exportData()" class="btn btn-secondary">Export Backup (JSON)</button>
                    <label class="btn btn-secondary text-center">
                        Import Backup
                        <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="display:none;">
                    </label>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
