<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Glide</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05030a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; 
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .hud-text {
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }
        #stall-warning {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            display: none;
            animation: blink 0.4s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 10, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        h1 {
            color: #ff00ff;
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.7);
        }
        p {
            color: #00ffcc;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        button {
            background: transparent;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            transition: all 0.2s ease;
        }
        button:hover, button:active {
            background: #ff00ff;
            color: #05030a;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-wrapper">
            <div>
                <div id="score-display" class="hud-text">DISTANCE: 0m</div>
                <div id="highscore-display" class="hud-text" style="color: #ffcc00; font-size: 16px; text-shadow: 0 0 8px rgba(255,204,0,0.5);">BEST: 0m</div>
            </div>
            <div id="speed-display" class="hud-text" style="color: #ff00ff; text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);">SPEED: 0MPH</div>
        </div>
        <div id="stall-warning">CRITICAL STALL</div>
    </div>

    <div id="screen-overlay">
        <h1 id="menu-title">NEON GLIDE</h1>
        <p id="menu-desc">Swipe UP to pitch up. Swipe DOWN to dive.<br>Build speed in dives, then pull up to soar! Avoid mines and stay airborne.</p>
        <button id="action-btn">INITIALIZE GLIDE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const speedDisplay = document.getElementById('speed-display');
        const stallWarning = document.getElementById('stall-warning');
        const screenOverlay = document.getElementById('screen-overlay');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const actionBtn = document.getElementById('action-btn');

        // Game States
        let gameState = 'START'; 
        let scoreDistance = 0;
        let globalHighScore = 0;
        let lastTime = 0;
        let boostFlashTimer = 0; 

        // Vector Aerodynamic Configurations
        const physics = {
            gravity: 0.09,             
            minPitch: -Math.PI / 3.5,  // Steeper max dive angles allowed
            maxPitch: Math.PI / 3.5,   // Steeper max climbs allowed
            stallPitch: Math.PI / 5.2, 
            pitchSpeed: 0.065,          
            dragBaseline: 0.008,       // Natural atmospheric drag slowing you down over time
            speedConversion: 0.16,     // How efficiently pitch adds gravity to forward airspeed
            liftFactor: 0.13,          // Controls velocity-to-altitude generation efficiency
            
            minSpeed: 1.5,             
            maxSpeed: 19.0,
            startingSpeed: 7.5,      
            startingAltitude: 200,
            baseSpeedCap: 7.5          
        };

        // Entities
        let glider = null; 
        let stars = [];
        let fans = [];
        let obstacles = [];
        let boosts = [];
        let terrainPoints = [];
        
        // Controls
        let touchStartY = 0;
        const swipeThreshold = 5;

        // --- HIGH SCORE BROWSER COOKIE MANAGEMENT ---
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/;SameSite=Strict";
        }

        function getCookie(name) {
            const cname = name + "=";
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(cname) === 0) return c.substring(cname.length, c.length);
            }
            return "";
        }

        function loadHighScore() {
            const savedScore = getCookie("neonglide_highscore");
            globalHighScore = savedScore !== "" ? parseInt(savedScore, 10) : 0;
            highscoreDisplay.innerText = `BEST: ${globalHighScore}m`;
        }

        function updateHighScoreCheck() {
            let currentFloorScore = Math.floor(scoreDistance);
            if (currentFloorScore > globalHighScore) {
                globalHighScore = currentFloorScore;
                setCookie("neonglide_highscore", globalHighScore, 365); 
                highscoreDisplay.innerText = `BEST: ${globalHighScore}m`;
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            if (gameState === 'START') initTerrain();
        }
        window.addEventListener('resize', resize);

        // --- INITIALIZERS ---
        function initStars() {
            stars = [];
            const layers = [
                { count: 60, speed: 0.1, size: 1.5, color: '#443366' },
                { count: 40, speed: 0.3, size: 2, color: '#00ffff' },
                { count: 15, speed: 0.6, size: 2.5, color: '#ff00ff' }
            ];
            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        speed: layer.speed,
                        size: layer.size,
                        color: layer.color
                    });
                }
            });
        }

        function initTerrain() {
            terrainPoints = [];
            const segments = Math.ceil(canvas.width / 40) + 2;
            for (let i = 0; i < segments; i++) {
                terrainPoints.push({ x: i * 40, y: canvas.height - 40 });
            }
        }

        function resetGame() {
            physics.baseSpeedCap = 7.5; 
            glider = {
                x: canvas.width * 0.2,
                y: physics.startingAltitude,
                width: 45,
                height: 20,
                forwardAirspeed: physics.startingSpeed, // Combined linear scalar magnitude
                vx: physics.startingSpeed,
                vy: 0,
                pitch: 0,          
                targetPitch: 0,    
                isStalling: false,
                inThermalUpdraft: false
            };
            fans = [];
            obstacles = [];
            boosts = [];
            scoreDistance = 0;
            boostFlashTimer = 0;
            initTerrain();
            loadHighScore();
            lastTime = performance.now();
            stallWarning.style.display = 'none';
        }

        // --- CONTROL HANDLING ---
        function handleSwipe(deltaY) {
            if (gameState !== 'PLAYING' || !glider) return;
            // Fixed direction coordinates: Up pitches up (nose skyward), Down pitches down (nose gridward)
            if (deltaY < -swipeThreshold) {
                glider.targetPitch = Math.max(glider.targetPitch - physics.pitchSpeed, physics.minPitch);
            } else if (deltaY > swipeThreshold) {
                glider.targetPitch = Math.min(glider.targetPitch + physics.pitchSpeed, physics.maxPitch);
            }
        }

        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const deltaY = currentY - touchStartY;
            handleSwipe(deltaY);
            touchStartY = currentY; 
        }, { passive: true });

        let isMouseDown = false;
        window.addEventListener('mousedown', (e) => { touchStartY = e.clientY; isMouseDown = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaY = e.clientY - touchStartY;
            handleSwipe(deltaY);
            touchStartY = e.clientY;
        });
        window.addEventListener('mouseup', () => isMouseDown = false);

        actionBtn.addEventListener('click', () => {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                screenOverlay.style.display = 'none';
                uiLayer.style.display = 'flex'; 
            }
        });

        // --- ENTITY MANIFEST INFRASTRUCTURE ---
        function spawnEntities() {
            if (fans.length === 0 || fans[fans.length - 1].x < canvas.width - 450) {
                if (Math.random() < 0.012) {
                    fans.push({ x: canvas.width + 50, width: 85, height: 50, pulse: 0 });
                }
            }

            if (boosts.length === 0 || boosts[boosts.length - 1].x < canvas.width - 650) {
                if (Math.random() < 0.004) {
                    boosts.push({
                        x: canvas.width + 50,
                        y: Math.random() * (canvas.height - 320) + 100,
                        size: 14,
                        pulse: 0
                    });
                }
            }

            const initialSpawnCap = 0.0022; 
            const difficultyScale = Math.min(initialSpawnCap + (scoreDistance * 0.0000015), 0.014);
            if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 400) {
                if (Math.random() < difficultyScale) {
                    obstacles.push({
                        x: canvas.width + 50,
                        baseY: Math.random() * (canvas.height - 260) + 80, 
                        radius: 15,
                        bobSpeed: 0.018 + Math.random() * 0.02,
                        bobRange: 25 + Math.random() * 35,
                        angle: Math.random() * Math.PI
                    });
                }
            }
        }

        // --- SYSTEM ENGINE SIMULATION ---
        function updateGame(dt) {
            if (!glider || gameState !== 'PLAYING') return;

            // Base scores run off true grid projection distance traversal rates (vx)
            scoreDistance += glider.vx * dt * 0.1;
            scoreDisplay.innerText = `DISTANCE: ${Math.floor(scoreDistance)}m`;
            speedDisplay.innerText = `SPEED: ${Math.round(glider.forwardAirspeed * 12)}MPH`;
            
            updateHighScoreCheck();

            if (boostFlashTimer > 0) boostFlashTimer -= dt;

            // Smoothly track structural angle interpolation adjustments
            glider.pitch += (glider.targetPitch - glider.pitch) * 0.12;

            // Evaluates True Aerodynamic Stall state variables
            // Stalling occurs when nose is pitched up past threshold and forward speed drops
            if (glider.pitch < -physics.stallPitch || glider.forwardAirspeed < physics.minSpeed) {
                glider.isStalling = true;
                // EXCEPTION: Stalling inside a fan is a valid vertical lift collection strategy
                if (!glider.inThermalUpdraft) {
                    stallWarning.style.display = 'block';
                } else {
                    stallWarning.style.display = 'none'; // Suppress warnings inside active fan
                }
            } else {
                glider.isStalling = false;
                stallWarning.style.display = 'none';
            }

            // DIRECTIONAL FLIGHT MATRIX EQUATIONS
            if (glider.isStalling) {
                // Drag bleeds off linear velocity
                glider.forwardAirspeed = Math.max(glider.forwardAirspeed - 0.035, physics.minSpeed);
                
                // Break down speed along heading orientation
                glider.vx = glider.forwardAirspeed * Math.cos(glider.pitch);
                glider.vy = glider.forwardAirspeed * Math.sin(glider.pitch) + (physics.gravity * 2.0); // Gravity dominates in a stall
                
                // Unresponsive safety correction forces nose down to gain speed naturally
                glider.targetPitch += 0.005; 
            } else {
                // Acceleration is added in the exact heading direction of the glider
                // Math.sin(glider.pitch) is negative when pointing down (climbing is positive radians in standard canvas coords)
                const relativeGravityAcceleration = -Math.sin(glider.pitch) * physics.speedConversion;
                
                // Update total linear magnitude energy array values
                glider.forwardAirspeed += relativeGravityAcceleration - physics.dragBaseline;
                
                const currentMaxCap = Math.max(physics.maxSpeed, physics.baseSpeedCap + 6);
                glider.forwardAirspeed = Math.max(physics.minSpeed, Math.min(glider.forwardAirspeed, currentMaxCap));

                // Deconstruct total velocity scalar onto 2D coordinate space projections
                // Added strictly in the vector direction the nose points
                glider.vx = glider.forwardAirspeed * Math.cos(glider.pitch);
                
                // Lift opposes gravity based on speed and wing surface geometry profiles
                const generationLift = Math.cos(glider.pitch) * (glider.forwardAirspeed * physics.liftFactor);
                glider.vy = (glider.forwardAirspeed * Math.sin(glider.pitch)) + (physics.gravity - generationLift);
            }

            // FAN STRATEGY RESOLUTION: Apply upward environmental thermal forces
            if (glider.inThermalUpdraft) {
                glider.vy -= 0.65; // Overrides dive arcs and lifts stall weights upward gracefully
                glider.forwardAirspeed = Math.min(glider.forwardAirspeed + 0.04, physics.maxSpeed); 
            }

            // Apply calculated coordinate steps
            glider.y += glider.vy;

            // Sky Ceiling Bounds Check
            if (glider.y < 35) {
                glider.y = 35;
                glider.vy = Math.max(0, glider.vy);
            }

            const currentScrollSpeed = glider.vx;

            // Parallax Scrollers
            stars.forEach(star => {
                star.x -= currentScrollSpeed * star.speed;
                if (star.x < 0) star.x = canvas.width;
            });

            spawnEntities();

            // Track fan spatial parameters on this step frame loop iteration
            glider.inThermalUpdraft = false;

            // Handle Fans Column Calculations
            for (let i = fans.length - 1; i >= 0; i--) {
                fans[i].x -= currentScrollSpeed;
                fans[i].pulse += 0.08;

                if (glider.x + 10 >= fans[i].x && glider.x - 30 <= fans[i].x + fans[i].width) {
                    if (glider.y < canvas.height - 40) { 
                        glider.inThermalUpdraft = true; // Caught inside thermal layer matrix area
                    }
                }
                if (fans[i].x + fans[i].width < 0) fans.splice(i, 1);
            }

            // Handle Golden Speed Boost Items
            for (let i = boosts.length - 1; i >= 0; i--) {
                boosts[i].x -= currentScrollSpeed;
                boosts[i].pulse += 0.05;

                const bDx = glider.x - boosts[i].x;
                const bDy = glider.y - boosts[i].y;
                const bDist = Math.sqrt(bDx * bDx + bDy * bDy);

                if (bDist < boosts[i].size + 15) {
                    physics.baseSpeedCap += 0.125; 
                    glider.forwardAirspeed = Math.min(glider.forwardAirspeed + 2.5, physics.maxSpeed + 4); 
                    boostFlashTimer = 25; 
                    boosts.splice(i, 1);
                    continue;
                }
                if (boosts[i].x + boosts[i].size * 2 < 0) boosts.splice(i, 1);
            }

            // Handle Cyber Hazards Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= currentScrollSpeed;
                obstacles[i].angle += obstacles[i].bobSpeed;
                obstacles[i].y = obstacles[i].baseY + Math.sin(obstacles[i].angle) * obstacles[i].bobRange;

                const dx = glider.x - obstacles[i].x;
                const dy = glider.y - obstacles[i].y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < obstacles[i].radius + 10) {
                    endGame();
                    return;
                }
                if (obstacles[i].x + obstacles[i].radius * 2 < 0) obstacles.splice(i, 1);
            }

            // Grid Floor Scrollers
            terrainPoints.forEach(p => { p.x -= currentScrollSpeed; });
            if (terrainPoints[0].x <= -40) {
                let shifted = terrainPoints.shift();
                shifted.x = terrainPoints[terrainPoints.length - 1].x + 40;
                terrainPoints.push(shifted);
            }

            if (glider.y + 8 >= canvas.height - 40) endGame();
        }

        function endGame() {
            gameState = 'GAMEOVER'; 
            stallWarning.style.display = 'none';
            uiLayer.style.display = 'none'; 
            menuTitle.innerText = "MATRIX CRASH";
            menuDesc.innerHTML = `Sector complete. Distance Traveled: <span style="color:#ff00ff">${Math.floor(scoreDistance)}m</span><br><span style="color:#ffcc00">High Score: ${globalHighScore}m</span>`;
            actionBtn.innerText = "REBOOT GLIDE";
            screenOverlay.style.display = 'flex';
        }

        // --- CANVAS GRAPHICS RENDER CHANNELS ---
        function draw() {
            ctx.fillStyle = '#05030a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            const scrollSpeed = (gameState === 'PLAYING' && glider) ? glider.vx : 1.5; 
            stars.forEach(star => {
                if (gameState !== 'PLAYING') {
                    star.x -= scrollSpeed * star.speed;
                    if (star.x < 0) star.x = canvas.width;
                }
                ctx.fillStyle = star.color;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Active Updraft Fans Columns
            fans.forEach(fan => {
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#0c1a24';
                ctx.fillRect(fan.x, canvas.height - 40 - fan.height, fan.width, fan.height);
                ctx.strokeRect(fan.x, canvas.height - 40 - fan.height, fan.width, fan.height);

                ctx.beginPath();
                ctx.moveTo(fan.x, canvas.height - 40 - fan.height/2);
                ctx.lineTo(fan.x + fan.width, canvas.height - 40 - fan.height/2);
                ctx.strokeStyle = '#ff00ff';
                ctx.stroke();

                ctx.save();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.18)';
                for (let h = 0; h < canvas.height - 40 - fan.height; h += 40) {
                    let offset = (Math.sin(fan.pulse + h/20) * 8);
                    ctx.beginPath();
                    ctx.moveTo(fan.x + offset, h);
                    ctx.lineTo(fan.x + fan.width + offset, h);
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Golden Speed Matrices Boosts
            boosts.forEach(bst => {
                ctx.save();
                ctx.translate(bst.x, bst.y);
                ctx.rotate(bst.pulse);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffcc00';
                ctx.strokeStyle = '#ffcc00';
                ctx.fillStyle = 'rgba(255, 204, 0, 0.15)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -bst.size); ctx.lineTo(bst.size, 0); ctx.lineTo(0, bst.size); ctx.lineTo(-bst.size, 0);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
                ctx.restore();
            });

            // Hazards Cyber Mines
            obstacles.forEach(obs => {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.strokeStyle = '#ff0055';
                ctx.fillStyle = '#14050f';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
                ctx.restore();
            });

            // Perspective Grid Floor Lines
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff00ff';
            ctx.beginPath();
            terrainPoints.forEach((p, idx) => {
                if (gameState !== 'PLAYING') p.x -= scrollSpeed; 
                if (idx === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            if (terrainPoints[0] && terrainPoints[0].x <= -40 && gameState !== 'PLAYING') {
                let shifted = terrainPoints.shift();
                shifted.x = terrainPoints[terrainPoints.length - 1].x + 40;
                terrainPoints.push(shifted);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Perspective Accents
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
            ctx.lineWidth = 1;
            terrainPoints.forEach((p) => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 20, canvas.height);
                ctx.stroke();
            });

            // Player Glider asset
            if (gameState === 'PLAYING' && glider) {
                ctx.save();
                ctx.translate(glider.x, glider.y);
                ctx.rotate(glider.pitch);

                ctx.shadowBlur = 15;
                let shipColor = glider.isStalling ? '#ff0055' : (boostFlashTimer > 0 ? '#ffcc00' : '#00ffcc');
                ctx.shadowColor = shipColor;
                ctx.strokeStyle = shipColor;
                ctx.lineWidth = 3;
                ctx.fillStyle = '#05030a';

                ctx.beginPath();
                ctx.moveTo(25, 0);       
                ctx.lineTo(-20, -16);    
                ctx.lineTo(-10, -5);     
                ctx.lineTo(-22, 0);      
                ctx.lineTo(-10, 5);      
                ctx.lineTo(-20, 16);     
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Thrust Engine Tail Output line rendering
                ctx.shadowColor = boostFlashTimer > 0 ? '#ffcc00' : '#ff00ff';
                ctx.strokeStyle = boostFlashTimer > 0 ? '#ffcc00' : '#ff00ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-22, 0);
                const trailLength = glider.isStalling ? 6 : 22 + (glider.forwardAirspeed * 2);
                ctx.lineTo(-trailLength, (Math.random() * 4) - 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- LIFE CYCLE LOOP TICKER ---
        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 16.666;
            if (dt > 4) dt = 4; 
            lastTime = timestamp;

            if (gameState === 'PLAYING') updateGame(dt);
            draw();
            requestAnimationFrame(loop);
        }

        loadHighScore();
        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
