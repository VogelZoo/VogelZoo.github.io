<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Glide</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05030a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; 
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-text {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }
        #stall-warning {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            opacity: 0;
            transition: opacity 0.1s ease;
            animation: blink 0.4s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 10, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        h1 {
            color: #ff00ff;
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.7);
        }
        p {
            color: #00ffcc;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        button {
            background: transparent;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            transition: all 0.2s ease;
        }
        button:hover, button:active {
            background: #ff00ff;
            color: #05030a;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div id="score-display" class="hud-text">TIME: 0.0s</div>
            <div id="speed-display" class="hud-text" style="color: #ff00ff; text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);">SPEED: 0MPH</div>
        </div>
        <div id="stall-warning">CRITICAL STALL</div>
    </div>

    <div id="screen-overlay">
        <h1 id="menu-title">NEON GLIDE</h1>
        <p id="menu-desc">Swipe UP to pitch nose up (gains altitude, loses speed).<br>Swipe DOWN to pitch nose down (gains speed, loses altitude).<br>Maintain stable airspeed to avoid stalling out!</p>
        <button id="action-btn">INITIALIZE GLIDE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const scoreDisplay = document.getElementById('score-display');
        const speedDisplay = document.getElementById('speed-display');
        const stallWarning = document.getElementById('stall-warning');
        const screenOverlay = document.getElementById('screen-overlay');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const actionBtn = document.getElementById('action-btn');

        // Game State
        let gameState = 'START'; 
        let score = 0;
        let lastTime = 0;

        // Tuned Physics System for Graceful Flight
        const physics = {
            gravity: 0.08,             // Lighter gravity for floats
            minPitch: -Math.PI / 5,    // Max down pitch (-36 deg)
            maxPitch: Math.PI / 4,     // Max up pitch (+45 deg)
            stallPitch: Math.PI / 7,   // Critical pitch ceiling
            pitchSpeed: 0.07,          // Balanced control responsiveness
            minSpeed: 2.0,
            maxSpeed: 14.0,
            startingSpeed: 7.5,      
            startingAltitude: 250   
        };

        // Entities
        let glider = null; 
        let stars = [];
        let fans = [];
        let terrainPoints = [];
        
        // Controls
        let touchStartY = 0;
        const swipeThreshold = 6;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            if (gameState === 'START') {
                initTerrain();
            }
        }
        window.addEventListener('resize', resize);

        // --- INITIALIZERS ---
        function initStars() {
            stars = [];
            const layers = [
                { count: 60, speed: 0.1, size: 1.5, color: '#443366' },
                { count: 40, speed: 0.3, size: 2, color: '#00ffff' },
                { count: 15, speed: 0.6, size: 2.5, color: '#ff00ff' }
            ];
            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        speed: layer.speed,
                        size: layer.size,
                        color: layer.color
                    });
                }
            });
        }

        function initTerrain() {
            terrainPoints = [];
            const segments = Math.ceil(canvas.width / 40) + 2;
            for (let i = 0; i < segments; i++) {
                terrainPoints.push({ x: i * 40, y: canvas.height - 40 });
            }
        }

        function resetGame() {
            glider = {
                x: canvas.width * 0.2,
                y: physics.startingAltitude,
                width: 45,
                height: 20,
                vx: physics.startingSpeed,
                vy: 0,
                pitch: 0,          
                targetPitch: 0,    
                isStalling: false  
            };
            fans = [];
            score = 0;
            initTerrain();
            lastTime = performance.now();
        }

        // --- CONTROLS ---
        function handleSwipe(deltaY) {
            if (gameState !== 'PLAYING' || !glider) return;

            // FIXED DIRECTION: Swiping UP now cleanly tilts the pitch target UPWARDS (negative radian coordinate space)
            if (deltaY < -swipeThreshold) {
                glider.targetPitch = Math.max(glider.targetPitch - physics.pitchSpeed, physics.minPitch);
            } else if (deltaY > swipeThreshold) {
                glider.targetPitch = Math.min(glider.targetPitch + physics.pitchSpeed, physics.maxPitch);
            }
        }

        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const deltaY = currentY - touchStartY;
            handleSwipe(deltaY);
            touchStartY = currentY; 
        }, { passive: true });

        let isMouseDown = false;
        window.addEventListener('mousedown', (e) => { touchStartY = e.clientY; isMouseDown = true; });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaY = e.clientY - touchStartY;
            handleSwipe(deltaY);
            touchStartY = e.clientY;
        });
        window.addEventListener('mouseup', () => isMouseDown = false);

        actionBtn.addEventListener('click', () => {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                screenOverlay.style.display = 'none';
                uiLayer.style.display = 'flex'; 
            }
        });

        // --- GAME LOGIC ---
        function spawnFans() {
            if (fans.length === 0 || fans[fans.length - 1].x < canvas.width - 450) {
                if (Math.random() < 0.012) {
                    fans.push({
                        x: canvas.width + 50,
                        width: 80,
                        height: 50,
                        pulse: 0
                    });
                }
            }
        }

        function updateGame(dt) {
            if (!glider || gameState !== 'PLAYING') return;

            // Keep tracking score only while actively playing
            score += dt * 0.0166; 
            scoreDisplay.innerText = `TIME: ${score.toFixed(1)}s`;
            speedDisplay.innerText = `SPEED: ${Math.round(glider.vx * 12)}MPH`;

            // Elastic structural easing for pitch maneuvers
            glider.pitch += (glider.targetPitch - glider.pitch) * 0.12;

            // Evaluates Stall Conditions (Nose pointed too high up relative to low air velocity speeds)
            if (glider.pitch < -physics.stallPitch || glider.vx < 2.5) {
                glider.isStalling = true;
                stallWarning.style.opacity = '1';
            } else {
                glider.isStalling = false;
                stallWarning.style.opacity = '0';
            }

            if (glider.isStalling) {
                // Drag mechanics in a stall drops forward velocity and dips nose down elegantly
                glider.vx = Math.max(glider.vx - 0.05, physics.minSpeed);
                glider.vy += physics.gravity * 1.8;
                glider.targetPitch += 0.008; // Forces nose down toward level flight
            } else {
                // Graceful Lift-to-Drag Gliding Physics Model
                const angleEffect = Math.sin(glider.pitch); // Upward pitch is negative angleEffect
                
                // Exchanging kinetic speed for structural lift
                glider.vx += angleEffect * 0.12 - 0.015; // Natural baseline friction drag
                glider.vx = Math.max(physics.minSpeed, Math.min(glider.vx, physics.maxSpeed));

                // Vertical translation calculation reflecting lift output from velocity
                const activeLift = -angleEffect * (glider.vx * 0.18);
                glider.vy += (physics.gravity - activeLift) * 0.2;
                glider.vy *= 0.88; // Air resistance dampening factor
            }

            glider.y += glider.vy;

            // Ceiling Boundary Clamp
            if (glider.y < 35) {
                glider.y = 35;
                glider.vy = Math.max(0, glider.vy);
            }

            const currentSpeed = glider.vx;

            // Move Starfield Layer
            stars.forEach(star => {
                star.x -= currentSpeed * star.speed;
                if (star.x < 0) star.x = canvas.width;
            });

            // Handle Fans & Thermal Updraft Collision
            spawnFans();
            for (let i = fans.length - 1; i >= 0; i--) {
                fans[i].x -= currentSpeed;
                fans[i].pulse += 0.08;

                // Detect if glider is passing through the fan's thermal column
                if (glider.x + 10 >= fans[i].x && glider.x - 30 <= fans[i].x + fans[i].width) {
                    if (glider.y < canvas.height - 40) { 
                        glider.vy -= 0.35; // Clean updraft pushing upward vector gracefully
                        glider.vx = Math.min(glider.vx + 0.04, physics.maxSpeed); // Thermal energy feeds air velocity
                    }
                }

                if (fans[i].x + fans[i].width < 0) {
                    fans.splice(i, 1);
                }
            }

            // Move Ground Lines
            terrainPoints.forEach(p => { p.x -= currentSpeed; });
            if (terrainPoints[0].x <= -40) {
                let shifted = terrainPoints.shift();
                shifted.x = terrainPoints[terrainPoints.length - 1].x + 40;
                terrainPoints.push(shifted);
            }

            // Crash Evaluation Condition
            if (glider.y + 8 >= canvas.height - 40) {
                endGame();
            }
        }

        function endGame() {
            gameState = 'GAMEOVER'; // Halts timer execution loops safely
            stallWarning.style.opacity = '0';
            uiLayer.style.display = 'none'; 
            menuTitle.innerText = "MATRIX CRASH";
            menuDesc.innerHTML = `System crashed. Final Flight Duration: <span style="color:#ff00ff">${score.toFixed(1)}s</span>`;
            actionBtn.innerText = "REBOOT GLIDE";
            screenOverlay.style.display = 'flex';
        }

        // --- RENDER REFRESH ENGINE ---
        function draw() {
            ctx.fillStyle = '#05030a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Stars
            const scrollSpeed = (gameState === 'PLAYING' && glider) ? glider.vx : 1.5; 
            stars.forEach(star => {
                if (gameState !== 'PLAYING') {
                    star.x -= scrollSpeed * star.speed;
                    if (star.x < 0) star.x = canvas.width;
                }
                ctx.fillStyle = star.color;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Fans
            fans.forEach(fan => {
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#0c1a24';
                ctx.fillRect(fan.x, canvas.height - 40 - fan.height, fan.width, fan.height);
                ctx.strokeRect(fan.x, canvas.height - 40 - fan.height, fan.width, fan.height);

                ctx.beginPath();
                ctx.moveTo(fan.x, canvas.height - 40 - fan.height/2);
                ctx.lineTo(fan.x + fan.width, canvas.height - 40 - fan.height/2);
                ctx.strokeStyle = '#ff00ff';
                ctx.stroke();

                ctx.save();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                for (let h = 0; h < canvas.height - 40 - fan.height; h += 40) {
                    let offset = (Math.sin(fan.pulse + h/20) * 8);
                    ctx.beginPath();
                    ctx.moveTo(fan.x + offset, h);
                    ctx.lineTo(fan.x + fan.width + offset, h);
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Floor Matrix Base Grid Lines
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff00ff';
            ctx.beginPath();
            terrainPoints.forEach((p, idx) => {
                if (gameState !== 'PLAYING') {
                    p.x -= scrollSpeed; 
                }
                if (idx === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            if (terrainPoints[0] && terrainPoints[0].x <= -40 && gameState !== 'PLAYING') {
                let shifted = terrainPoints.shift();
                shifted.x = terrainPoints[terrainPoints.length - 1].x + 40;
                terrainPoints.push(shifted);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Grid Perspective Accent Paths
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
            ctx.lineWidth = 1;
            terrainPoints.forEach((p) => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 20, canvas.height);
                ctx.stroke();
            });

            // Player Glider Rendering Logic
            if (gameState === 'PLAYING' && glider) {
                ctx.save();
                ctx.translate(glider.x, glider.y);
                ctx.rotate(glider.pitch);

                ctx.shadowBlur = 15;
                ctx.shadowColor = glider.isStalling ? '#ff0055' : '#00ffcc';
                ctx.strokeStyle = glider.isStalling ? '#ff0055' : '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#05030a';

                ctx.beginPath();
                ctx.moveTo(25, 0);       
                ctx.lineTo(-20, -16);    
                ctx.lineTo(-10, -5);     
                ctx.lineTo(-22, 0);      
                ctx.lineTo(-10, 5);      
                ctx.lineTo(-20, 16);     
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Engine Flame Effect
                ctx.shadowColor = '#ff00ff';
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-22, 0);
                const trailLength = glider.isStalling ? 8 : 25 + (glider.vx * 2);
                ctx.lineTo(-trailLength, (Math.random() * 4) - 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- MAIN APPLICATION TIMING LOOP ---
        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 16.666;
            if (dt > 4) dt = 4; 
            lastTime = timestamp;

            if (gameState === 'PLAYING') {
                updateGame(dt);
            }
            draw();
            requestAnimationFrame(loop);
        }

        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
