<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Glide</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05030a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            /* Hidden until the player presses start */
            display: none; 
        }
        .hud-text {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }
        #stall-warning {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
            opacity: 0;
            transition: opacity 0.1s ease;
            animation: blink 0.4s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 10, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        h1 {
            color: #ff00ff;
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.7);
        }
        p {
            color: #00ffcc;
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        button {
            background: transparent;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            transition: all 0.2s ease;
        }
        button:hover, button:active {
            background: #ff00ff;
            color: #05030a;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div id="score-display" class="hud-text">TIME: 0.0s</div>
            <div id="speed-display" class="hud-text" style="color: #ff00ff; text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);">SPEED: 0MPH</div>
        </div>
        <div id="stall-warning">CRITICAL STALL</div>
    </div>

    <div id="screen-overlay">
        <h1 id="menu-title">NEON GLIDE</h1>
        <p id="menu-desc">Swipe UP to pitch nose up (gains altitude, loses speed).<br>Swipe DOWN to pitch nose down (gains speed, loses altitude).<br>Maintain stable airspeed to avoid stalling out!</p>
        <button id="action-btn">INITIALIZE GLIDE</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiLayer = document.getElementById('ui-layer');
        const scoreDisplay = document.getElementById('score-display');
        const speedDisplay = document.getElementById('speed-display');
        const stallWarning = document.getElementById('stall-warning');
        const screenOverlay = document.getElementById('screen-overlay');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const actionBtn = document.getElementById('action-btn');

        // Game State
        let gameState = 'START'; 
        let score = 0;
        let lastTime = 0;

        // Configuration Systems
        const physics = {
            gravity: 0.15,
            minPitch: -Math.PI / 4,  
            maxPitch: Math.PI / 3,   
            stallPitch: Math.PI / 6, 
            pitchSpeed: 0.09,
            minSpeed: 1.5,
            maxSpeed: 18,
            
            // STABLE START PARAMETERS
            startingSpeed: 8.0,      
            startingAltitude: 200,   
            baseSpeed: 8
        };

        // Entities
        let glider = null; // Stays null until game starts
        let stars = [];
        let fans = [];
        let terrainPoints = [];
        
        // Control variables
        let touchStartY = 0;
        const swipeThreshold = 8;

        // Resize handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
            if (gameState === 'START') {
                initTerrain();
            }
        }
        window.addEventListener('resize', resize);

        // --- INITIALIZERS ---
        function initStars() {
            stars = [];
            const layers = [
                { count: 60, speed: 0.1, size: 1.5, color: '#443366' },
                { count: 40, speed: 0.3, size: 2, color: '#00ffff' },
                { count: 15, speed: 0.6, size: 2.5, color: '#ff00ff' }
            ];
            
            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        speed: layer.speed,
                        size: layer.size,
                        color: layer.color
                    });
                }
            });
        }

        function initTerrain() {
            terrainPoints = [];
            const segments = Math.ceil(canvas.width / 40) + 2;
            for (let i = 0; i < segments; i++) {
                terrainPoints.push({
                    x: i * 40,
                    y: canvas.height - 40
                });
            }
        }

        function resetGame() {
            // Instantiate the glider entity safely
            glider = {
                x: canvas.width * 0.2,
                y: physics.startingAltitude,
                width: 45,
                height: 20,
                vx: physics.startingSpeed,
                vy: 0,
                pitch: 0,          
                targetPitch: 0,    
                isStalling: false  
            };
            fans = [];
            score = 0;
            initTerrain();
            lastTime = performance.now();
        }

        // --- CONTROLS ---
        function handleSwipe(deltaY) {
            if (gameState !== 'PLAYING' || !glider) return;

            if (deltaY < -swipeThreshold) {
                glider.targetPitch = Math.min(glider.targetPitch + physics.pitchSpeed, physics.maxPitch);
            } else if (deltaY > swipeThreshold) {
                glider.targetPitch = Math.max(glider.targetPitch - physics.pitchSpeed, physics.minPitch);
            }
        }

        // Touch Listeners
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const deltaY = currentY - touchStartY;
            handleSwipe(deltaY);
            touchStartY = currentY; 
        }, { passive: true });

        // Mouse Fallbacks
        let isMouseDown = false;
        window.addEventListener('mousedown', (e) => {
            touchStartY = e.clientY;
            isMouseDown = true;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaY = e.clientY - touchStartY;
            handleSwipe(deltaY);
            touchStartY = e.clientY;
        });
        window.addEventListener('mouseup', () => isMouseDown = false);

        // UI Interactions
        actionBtn.addEventListener('click', () => {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                resetGame();
                gameState = 'PLAYING';
                screenOverlay.style.display = 'none';
                uiLayer.style.display = 'flex'; // Make HUD text look active
            }
        });

        // --- GAME LOGIC ---
        function spawnFans() {
            if (fans.length === 0 || fans[fans.length - 1].x < canvas.width - 400) {
                if (Math.random() < 0.015) {
                    fans.push({
                        x: canvas.width + 50,
                        width: 70,
                        height: 60,
                        pulse: 0
                    });
                }
            }
        }

        function updateGame(dt) {
            if (!glider) return;

            score += dt;
            scoreDisplay.innerText = `TIME: ${(score).toFixed(1)}s`;
            speedDisplay.innerText = `SPEED: ${Math.round(glider.vx * 10)}MPH`;

            glider.pitch += (glider.targetPitch - glider.pitch) * 0.1;

            if (glider.pitch > physics.stallPitch || glider.vx < 3.0) {
                glider.isStalling = true;
                stallWarning.style.opacity = '1';
            } else {
                glider.isStalling = false;
                stallWarning.style.opacity = '0';
            }

            if (glider.isStalling) {
                glider.vx = Math.max(glider.vx - 0.08, physics.minSpeed);
                glider.vy += physics.gravity * 2.2;
                if (glider.targetPitch > 0) {
                    glider.targetPitch -= 0.005; 
                }
            } else {
                const pitchFactor = Math.sin(glider.pitch);
                glider.vx -= pitchFactor * 0.22;

                if (glider.pitch < 0) {
                    glider.vx = Math.min(glider.vx + 0.1, physics.maxSpeed);
                } else {
                    glider.vx = Math.max(glider.vx, physics.minSpeed);
                }

                glider.vy = (physics.gravity * 2.5) - (glider.vx * Math.sin(glider.pitch) * 0.85);
            }

            glider.y += glider.vy;

            if (glider.y < 30) {
                glider.y = 30;
                glider.vy = Math.max(0, glider.vy);
            }

            const currentSpeed = glider.vx;

            stars.forEach(star => {
                star.x -= currentSpeed * star.speed;
                if (star.x < 0) star.x = canvas.width;
            });

            spawnFans();
            for (let i = fans.length - 1; i >= 0; i--) {
                fans[i].x -= currentSpeed;
                fans[i].pulse += 0.1;

                if (glider.x + glider.width/2 >= fans[i].x && glider.x - glider.width/2 <= fans[i].x + fans[i].width) {
                    if (glider.y < canvas.height - 40) { 
                        glider.vy -= 1.4; 
                        glider.y -= 4;   
                        glider.vx = Math.min(glider.vx + 0.15, physics.maxSpeed);
                    }
                }

                if (fans[i].x + fans[i].width < 0) {
                    fans.splice(i, 1);
                }
            }

            terrainPoints.forEach(p => { p.x -= currentSpeed; });
            if (terrainPoints[0].x <= -40) {
                let shifted = terrainPoints.shift();
                shifted.x = terrainPoints[terrainPoints.length - 1].x + 40;
                terrainPoints.push(shifted);
            }

            if (glider.y + glider.height / 2 >= canvas.height - 40) {
                endGame();
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            stallWarning.style.opacity = '0';
            uiLayer.style.display = 'none'; // Hide metrics overlay on loss screen
            menuTitle.innerText = "MATRIX CRASH";
            menuDesc.innerHTML = `You survived for <span style="color:#ff00ff">${(score).toFixed(1)}</span> seconds before impacting the grid.`;
            actionBtn.innerText = "REBOOT GLIDE";
            screenOverlay.style.display = 'flex';
        }

        // --- DRAW RENDERS ---
        function draw() {
            ctx.fillStyle = '#05030a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Stars
            const scrollSpeed = (gameState === 'PLAYING' && glider) ? glider.vx : 2; 
            stars.forEach(star => {
                if (gameState !== 'PLAYING') {
                    star.x -= scrollSpeed * star.speed; // Keep background animated on menu
                    if (star.x < 0) star.x = canvas.width;
                }
                ctx.fillStyle = star.color;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Fans
            fans.forEach(fan => {
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#0c1a24';
                ctx.fillRect(fan.x, canvas.height - 40 - fan.height, fan.width, fan.height);
                ctx.strokeRect(fan.x, canvas.height - 40 - fan.height, fan.width, fan.height);

                ctx.beginPath();
                ctx.moveTo(fan.x, canvas.height - 40 - fan.height/2);
                ctx.lineTo(fan.x + fan.width, canvas.height - 40 - fan.height/2);
                ctx.strokeStyle = '#ff00ff';
                ctx.stroke();

                ctx.save();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
                for (let h = 0; h < canvas.height - 40 - fan.height; h += 40) {
                    let offset = (Math.sin(fan.pulse + h/20) * 8);
                    ctx.beginPath();
                    ctx.moveTo(fan.x + offset, h);
                    ctx.lineTo(fan.x + fan.width + offset, h);
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Floor Matrix Base Grid Lines
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff00ff';
            ctx.beginPath();
            terrainPoints.forEach((p, idx) => {
                if (gameState !== 'PLAYING') {
                    p.x -= scrollSpeed; // Animate terrain on menu screens
                }
                if (idx === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            if (terrainPoints[0] && terrainPoints[0].x <= -40 && gameState !== 'PLAYING') {
                let shifted = terrainPoints.shift();
                shifted.x = terrainPoints[terrainPoints.length - 1].x + 40;
                terrainPoints.push(shifted);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Longitudinal Perspective lines
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.25)';
            ctx.lineWidth = 1;
            terrainPoints.forEach((p) => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 20, canvas.height);
                ctx.stroke();
            });

            // Neon Glider Asset Rendering (Only render if game active and object initialized)
            if (gameState === 'PLAYING' && glider) {
                ctx.save();
                ctx.translate(glider.x, glider.y);
                ctx.rotate(glider.pitch);

                ctx.shadowBlur = 15;
                ctx.shadowColor = glider.isStalling ? '#ff0055' : '#00ffcc';
                ctx.strokeStyle = glider.isStalling ? '#ff0055' : '#00ffcc';
                ctx.lineWidth = 3;
                ctx.fillStyle = '#05030a';

                ctx.beginPath();
                ctx.moveTo(25, 0);       
                ctx.lineTo(-20, -18);    
                ctx.lineTo(-10, -5);     
                ctx.lineTo(-22, 0);      
                ctx.lineTo(-10, 5);      
                ctx.lineTo(-20, 18);     
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Dynamic thrust trail scaling with velocity
                ctx.shadowColor = '#ff00ff';
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-22, 0);
                const trailLength = glider.isStalling ? 10 : 35 + (glider.vx * 1.5);
                ctx.lineTo(-trailLength, (Math.random() * 4) - 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- CORE LOOP ---
        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 16.666;
            if (dt > 4) dt = 4; 
            lastTime = timestamp;

            updateGame(dt);
            draw();
            requestAnimationFrame(loop);
        }

        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
