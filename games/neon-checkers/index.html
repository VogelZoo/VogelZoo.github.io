<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON CHECKERS // GRID WAR</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f5ff;
    --magenta: #ff00aa;
    --yellow: #ffee00;
    --dark: #050810;
    --dark2: #0a1020;
    --dark3: #0d1530;
    --glow-cyan: 0 0 8px #00f5ff, 0 0 20px #00f5ff55;
    --glow-magenta: 0 0 8px #ff00aa, 0 0 20px #ff00aa55;
    --glow-yellow: 0 0 8px #ffee00, 0 0 20px #ffee0055;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    color: #ccd6f6;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  /* Full-viewport flex layout */
  .container {
    position: relative;
    z-index: 10;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    gap: 6px;
    overflow: hidden;
  }

  /* ── Header ── */
  .header { text-align: center; flex-shrink: 0; line-height: 1.1; }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(0.85rem, 2.2vw, 1.6rem);
    letter-spacing: 0.15em;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--cyan));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
  }

  .header .subtitle {
    font-size: clamp(0.45rem, 1vw, 0.6rem);
    color: var(--yellow);
    letter-spacing: 0.4em;
    text-shadow: var(--glow-yellow);
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* ── Status bar ── */
  .status-bar {
    flex-shrink: 0;
    font-size: clamp(0.5rem, 1.2vw, 0.75rem);
    letter-spacing: 0.18em;
    padding: 4px 14px;
    border: 1px solid var(--yellow);
    color: var(--yellow);
    text-shadow: var(--glow-yellow);
    box-shadow: var(--glow-yellow);
    background: rgba(255,238,0,0.05);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    text-align: center;
    animation: status-glow 2s ease-in-out infinite alternate;
  }

  @keyframes status-glow {
    from { box-shadow: 0 0 6px #ffee00, 0 0 12px #ffee0033; }
    to   { box-shadow: 0 0 12px #ffee00, 0 0 24px #ffee0066; }
  }

  /* ── Middle row: panels + board ── */
  .game-layout {
    display: flex;
    gap: clamp(6px, 1.2vw, 18px);
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* ── Player Panels (landscape: sides) ── */
  .player-panel {
    width: clamp(70px, 11vw, 140px);
    flex-shrink: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ── Portrait: panels row below board ── */
  .panels-row {
    display: none;
    gap: clamp(8px, 3vw, 20px);
    width: 100%;
    justify-content: center;
    flex-shrink: 0;
  }

  @media (orientation: portrait) {
    .game-layout .player-panel { display: none; }
    .panels-row { display: flex; }
    .game-layout { flex: 0 0 auto; }
    .container { justify-content: flex-start; padding-top: clamp(8px, 2vh, 20px); }

    .panels-row .player-panel {
      display: flex;
      flex-direction: column;
      width: clamp(120px, 42vw, 240px);
      flex-shrink: 0;
    }
    .panels-row .panel-card {
      display: flex;
      flex-direction: column;
      padding: clamp(5px, 2vw, 10px) clamp(8px, 3vw, 14px);
    }
    .panels-row .player-label   { font-size: clamp(0.42rem, 2vw, 0.58rem); margin-bottom: 2px; }
    .panels-row .player-name    { font-size: clamp(0.55rem, 2.5vw, 0.85rem); margin-bottom: 6px; }
    .panels-row .pieces-label   { font-size: clamp(0.38rem, 1.6vw, 0.5rem); }
    .panels-row .piece-count    { font-size: clamp(0.9rem, 4vw, 1.4rem); }
    .panels-row .king-count     { font-size: clamp(0.42rem, 1.8vw, 0.65rem); }
    .panels-row .status-tag     { font-size: clamp(0.38rem, 1.6vw, 0.5rem); margin-top: 5px; }
  }

  .panel-card {
    border: 1px solid;
    padding: clamp(6px, 1vw, 12px);
    background: var(--dark2);
    position: relative;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }

  .p1-panel .panel-card { border-color: var(--cyan);    box-shadow: inset 0 0 16px rgba(0,245,255,0.05), var(--glow-cyan); }
  .p2-panel .panel-card { border-color: var(--magenta); box-shadow: inset 0 0 16px rgba(255,0,170,0.05), var(--glow-magenta); }

  .player-label {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.4rem, 0.7vw, 0.58rem);
    letter-spacing: 0.25em;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  .p1-panel .player-label { color: var(--cyan); }
  .p2-panel .player-label { color: var(--magenta); }

  .player-name {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.5rem, 0.9vw, 0.82rem);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .p1-panel .player-name { color: var(--cyan);    text-shadow: var(--glow-cyan); }
  .p2-panel .player-name { color: var(--magenta); text-shadow: var(--glow-magenta); }

  .active-indicator {
    height: 2px;
    margin-bottom: 8px;
    background: transparent;
    transition: background 0.3s;
  }
  .active-indicator.active { animation: pulse-bar 1s ease-in-out infinite alternate; }
  .p1-panel .active-indicator.active { background: var(--cyan);    box-shadow: var(--glow-cyan); }
  .p2-panel .active-indicator.active { background: var(--magenta); box-shadow: var(--glow-magenta); }
  @keyframes pulse-bar { from { opacity: 0.5; } to { opacity: 1; } }

  .pieces-label {
    font-size: clamp(0.38rem, 0.65vw, 0.52rem);
    opacity: 0.5;
    letter-spacing: 0.15em;
    margin-bottom: 3px;
    color: #ccd6f6;
  }

  .piece-count {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1rem, 2vw, 1.4rem);
    font-weight: 700;
  }
  .p1-panel .piece-count { color: var(--cyan);    text-shadow: var(--glow-cyan); }
  .p2-panel .piece-count { color: var(--magenta); text-shadow: var(--glow-magenta); }

  .king-count {
    font-size: clamp(0.42rem, 0.75vw, 0.65rem);
    margin-top: 3px;
    opacity: 0.7;
    letter-spacing: 0.1em;
  }

  .status-tag {
    margin-top: 7px;
    font-size: clamp(0.38rem, 0.6vw, 0.52rem);
    padding: 3px 6px;
    text-align: center;
    letter-spacing: 0.15em;
    display: none;
  }
  .status-tag.show { display: block; }
  .p1-panel .status-tag { border: 1px solid var(--cyan);    color: var(--cyan);    background: rgba(0,245,255,0.05); }
  .p2-panel .status-tag { border: 1px solid var(--magenta); color: var(--magenta); background: rgba(255,0,170,0.05); }

  /* ── Board area ── */
  .board-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    min-height: 0;
  }

  .board-coords-wrap { display: flex; align-items: stretch; }

  /* Rank coords: grid-aligned */
  .coords-col {
    display: grid;
    grid-template-rows: repeat(8, var(--sq));
    padding: 0 4px 0 2px;
    font-size: calc(var(--sq) * 0.22);
    color: rgba(0,245,255,0.45);
    letter-spacing: 0.05em;
  }
  .coords-col span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: var(--sq);
  }

  .coords-row {
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    padding: 3px 0 0;
    font-size: calc(var(--sq) * 0.2);
    color: rgba(0,245,255,0.45);
    text-align: center;
  }
  .coords-row span {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .board {
    --sq: 60px;
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    grid-template-rows: repeat(8, var(--sq));
    border: 1px solid var(--cyan);
    box-shadow: 0 0 30px rgba(0,245,255,0.2), inset 0 0 30px rgba(0,0,0,0.5);
    position: relative;
  }

  .board::before {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid rgba(0,245,255,0.2);
    pointer-events: none;
  }

  .sq {
    width: var(--sq);
    height: var(--sq);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    position: relative;
    transition: background 0.12s;
  }

  .sq.light { background: #112240; }
  .sq.dark  { background: #07101f; cursor: pointer; }
  .sq.dark:hover { background: #0e1a2e; }

  .sq.selected {
    background: rgba(0,245,255,0.30) !important;
    box-shadow: inset 0 0 0 3px var(--cyan), inset 0 0 18px rgba(0,245,255,0.45);
  }

  .sq.valid-move::after {
    content: '';
    position: absolute;
    width: 32%; height: 32%;
    border-radius: 50%;
    background: rgba(0,245,255,0.65);
    box-shadow: 0 0 14px #00f5ff, 0 0 28px rgba(0,245,255,0.4);
    pointer-events: none;
    z-index: 1;
  }

  .sq.valid-capture::after {
    content: '';
    position: absolute;
    inset: 4px;
    border: 3px solid #ff00aa;
    background: rgba(255,0,170,0.12);
    box-shadow: inset 0 0 12px rgba(255,0,170,0.45), 0 0 10px rgba(255,0,170,0.35);
    pointer-events: none;
    z-index: 1;
  }

  .sq.last-move { background: rgba(255,238,0,0.10) !important; }

  /* Checker pieces */
  .checker {
    width: 76%; height: 76%;
    border-radius: 50%;
    position: relative;
    z-index: 2;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .checker.p1 {
    background: radial-gradient(circle at 35% 35%, #00faff, #007a99);
    box-shadow: 0 0 10px #00f5ff, 0 0 22px rgba(0,245,255,0.5), inset 0 -3px 6px rgba(0,0,0,0.4);
    border: 2px solid rgba(0,245,255,0.8);
  }
  .checker.p2 {
    background: radial-gradient(circle at 35% 35%, #ff55cc, #990055);
    box-shadow: 0 0 10px #ff00aa, 0 0 22px rgba(255,0,170,0.5), inset 0 -3px 6px rgba(0,0,0,0.4);
    border: 2px solid rgba(255,0,170,0.8);
  }
  .checker.selected-piece.p1 {
    transform: scale(1.12);
    box-shadow: 0 0 18px #00f5ff, 0 0 36px rgba(0,245,255,0.7), inset 0 -3px 6px rgba(0,0,0,0.4);
  }
  .checker.selected-piece.p2 {
    transform: scale(1.12);
    box-shadow: 0 0 18px #ff00aa, 0 0 36px rgba(255,0,170,0.7), inset 0 -3px 6px rgba(0,0,0,0.4);
  }
  .checker.must-jump-piece {
    border-color: #ffaa00;
    box-shadow: 0 0 14px #ffaa00, 0 0 28px rgba(255,170,0,0.5), inset 0 -3px 6px rgba(0,0,0,0.4);
    animation: must-pulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes must-pulse { from { opacity: 0.8; } to { opacity: 1; } }

  .king-crown {
    font-size: calc(var(--sq) * 0.28);
    line-height: 1;
    color: var(--yellow);
    text-shadow: 0 0 6px #ffee00;
  }

  /* ── Move log ── */
  .move-log-wrap { flex-shrink: 0; width: calc(8 * var(--sq) + 20px); }

  .move-log-header {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.38rem, 0.65vw, 0.52rem);
    letter-spacing: 0.25em;
    color: rgba(0,245,255,0.45);
    margin-bottom: 2px;
  }

  .move-log {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    max-height: 36px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 6px;
    background: var(--dark2);
    border: 1px solid rgba(0,245,255,0.12);
    font-size: clamp(0.45rem, 0.75vw, 0.62rem);
    color: rgba(204,214,246,0.55);
  }
  .move-log::-webkit-scrollbar { width: 3px; }
  .move-log::-webkit-scrollbar-track { background: var(--dark); }
  .move-log::-webkit-scrollbar-thumb { background: var(--cyan); }

  .move-entry { white-space: nowrap; }
  .move-entry .num { color: rgba(255,238,0,0.45); margin-right: 2px; }
  .move-entry .w   { color: var(--cyan); }
  .move-entry .b   { color: var(--magenta); margin-left: 3px; }

  /* ── Game Over ── */
  .gameover-overlay {
    position: fixed; inset: 0;
    background: rgba(5,8,16,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .gameover-overlay.show { display: flex; }

  .gameover-modal {
    border: 1px solid var(--cyan);
    background: var(--dark2);
    padding: 28px 36px;
    box-shadow: var(--glow-cyan), 0 0 70px rgba(0,245,255,0.18);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    text-align: center;
    max-width: 340px;
  }
  .gameover-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem; font-weight: 900;
    letter-spacing: 0.2em;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .gameover-sub    { color: var(--yellow); font-size: 0.7rem; letter-spacing: 0.3em; margin-bottom: 16px; text-shadow: var(--glow-yellow); }
  .gameover-winner { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; margin-bottom: 20px; color: #ccd6f6; }

  .restart-btn {
    padding: 9px 24px;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    transition: all 0.2s;
    text-shadow: var(--glow-cyan);
    box-shadow: var(--glow-cyan);
  }
  .restart-btn:hover { background: rgba(0,245,255,0.1); box-shadow: 0 0 20px #00f5ff, 0 0 40px #00f5ff55; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>NEON CHECKERS</h1>
    <div class="subtitle">// GRID WAR PROTOCOL //</div>
  </div>

  <div class="status-bar" id="status-bar">INITIALIZING...</div>

  <div class="game-layout">
    <!-- P1 (landscape) -->
    <div class="player-panel p1-panel">
      <div class="panel-card">
        <div class="player-label">// P01</div>
        <div class="player-name">CYAN</div>
        <div class="active-indicator" id="p1-indicator"></div>
        <div class="pieces-label">PIECES:</div>
        <div class="piece-count" id="p1-count">12</div>
        <div class="king-count" id="p1-kings">♛ 0 KINGS</div>
        <div class="status-tag" id="p1-must">⚡ MUST JUMP</div>
      </div>
    </div>

    <!-- Board -->
    <div class="board-area">
      <div class="board-coords-wrap">
        <div class="coords-col" id="rank-coords"></div>
        <div>
          <div class="board" id="board"></div>
          <div class="coords-row" id="file-coords"></div>
        </div>
      </div>
      <div class="move-log-wrap" id="move-log-wrap">
        <div class="move-log-header">// MOVE HISTORY</div>
        <div class="move-log" id="move-log"></div>
      </div>
    </div>

    <!-- P2 (landscape) -->
    <div class="player-panel p2-panel">
      <div class="panel-card">
        <div class="player-label">// P02</div>
        <div class="player-name">MAGENTA</div>
        <div class="active-indicator" id="p2-indicator"></div>
        <div class="pieces-label">PIECES:</div>
        <div class="piece-count" id="p2-count">12</div>
        <div class="king-count" id="p2-kings">♛ 0 KINGS</div>
        <div class="status-tag" id="p2-must">⚡ MUST JUMP</div>
      </div>
    </div>
  </div>

  <!-- Portrait: panels below board -->
  <div class="panels-row">
    <div class="player-panel p1-panel">
      <div class="panel-card">
        <div class="player-label">// P01</div>
        <div class="player-name">CYAN</div>
        <div class="active-indicator" id="p1-indicator-b"></div>
        <div class="pieces-label">PIECES:</div>
        <div class="piece-count" id="p1-count-b">12</div>
        <div class="king-count" id="p1-kings-b">♛ 0 KINGS</div>
        <div class="status-tag" id="p1-must-b">⚡ MUST JUMP</div>
      </div>
    </div>
    <div class="player-panel p2-panel">
      <div class="panel-card">
        <div class="player-label">// P02</div>
        <div class="player-name">MAGENTA</div>
        <div class="active-indicator" id="p2-indicator-b"></div>
        <div class="pieces-label">PIECES:</div>
        <div class="piece-count" id="p2-count-b">12</div>
        <div class="king-count" id="p2-kings-b">♛ 0 KINGS</div>
        <div class="status-tag" id="p2-must-b">⚡ MUST JUMP</div>
      </div>
    </div>
  </div>
</div>

<!-- Game Over -->
<div class="gameover-overlay" id="gameover-overlay">
  <div class="gameover-modal">
    <div class="gameover-title">GAME OVER</div>
    <div class="gameover-sub" id="gameover-sub">// PROTOCOL TERMINATED //</div>
    <div class="gameover-winner" id="gameover-winner"></div>
    <button class="restart-btn" onclick="initGame()">// RESTART //</button>
  </div>
</div>

<script>
// ===================== RESPONSIVE SIZING =====================

function computeSq() {
  const portrait = window.innerHeight > window.innerWidth;
  if (portrait) {
    const chrome = 210; // header + status + move-log + panels-row + gaps
    const coordCol = 24;
    const availH = window.innerHeight - chrome;
    const availW = window.innerWidth - coordCol - 16;
    return Math.max(28, Math.min(Math.floor(Math.min(availH, availW) / 8), 90));
  } else {
    const chrome = 150;
    const panelW = Math.min(140, Math.max(70, window.innerWidth * 0.11));
    const availH = window.innerHeight - chrome;
    const availW = window.innerWidth - panelW * 2 - 80;
    return Math.max(32, Math.min(Math.floor(Math.min(availH, availW) / 8), 90));
  }
}

function applySq(sq) {
  document.getElementById('board').style.setProperty('--sq', sq + 'px');
  document.querySelectorAll('.coords-col, .coords-row').forEach(el => {
    el.style.setProperty('--sq', sq + 'px');
  });
  const lw = document.getElementById('move-log-wrap');
  if (lw) lw.style.width = (8 * sq + 20) + 'px';
}

window.addEventListener('resize', () => applySq(computeSq()));

// ===================== CHECKERS ENGINE =====================

let board, turn, selected, validMoves, gameOver;
let mustJumpPieces, moveHistory, fullMoveNumber;
let lastMovedFrom, lastMovedTo;

function isKing(p) { return p === 'C' || p === 'M'; }
function owner(p)  { return p && (p.toLowerCase() === 'c' ? 'c' : 'm'); }
function enemy(t)  { return t === 'c' ? 'm' : 'c'; }
function isDark(r,c){ return (r+c)%2 !== 0; }

function initGame() {
  board = Array.from({length:8}, () => Array(8).fill(null));
  for (let r=0;r<3;r++) for (let c=0;c<8;c++) if (isDark(r,c)) board[r][c]='m';
  for (let r=5;r<8;r++) for (let c=0;c<8;c++) if (isDark(r,c)) board[r][c]='c';

  turn = 'c';
  selected = null;
  validMoves = [];
  gameOver = false;
  moveHistory = [];
  fullMoveNumber = 1;
  lastMovedFrom = null;
  lastMovedTo = null;
  mustJumpPieces = getMustJumpPieces('c');

  document.getElementById('gameover-overlay').classList.remove('show');
  applySq(computeSq());
  renderBoard();
  updateUI();
}

function getMovesFor(b, r, c, jumpOnly) {
  const p = b[r][c];
  if (!p) return [];
  const own = owner(p), opp = enemy(own);
  const dirs = [];
  if (own === 'c' || isKing(p)) dirs.push([-1,-1],[-1,1]);
  if (own === 'm' || isKing(p)) dirs.push([1,-1],[1,1]);
  const moves = [];
  for (const [dr,dc] of dirs) {
    const nr=r+dr, nc=c+dc;
    if (nr<0||nr>7||nc<0||nc>7) continue;
    const nb = b[nr][nc];
    if (!nb && !jumpOnly) {
      moves.push({fr:r,fc:c,tr:nr,tc:nc,jump:false});
    } else if (nb && owner(nb)===opp) {
      const jr=r+2*dr, jc=c+2*dc;
      if (jr>=0&&jr<=7&&jc>=0&&jc<=7&&!b[jr][jc])
        moves.push({fr:r,fc:c,tr:jr,tc:jc,jump:true,cap:[nr,nc]});
    }
  }
  return moves;
}

function getMustJumpPieces(t) {
  const jumpers = [];
  for (let r=0;r<8;r++)
    for (let c=0;c<8;c++)
      if (board[r][c] && owner(board[r][c])===t)
        if (getMovesFor(board,r,c,true).length>0)
          jumpers.push(`${r},${c}`);
  return jumpers;
}

function getContinuationJumps(b, r, c) { return getMovesFor(b, r, c, true); }

let midJump = null;

function onSquareClick(r, c) {
  if (gameOver) return;
  if (midJump) {
    const cont = getContinuationJumps(board, midJump.r, midJump.c).filter(m=>m.tr===r&&m.tc===c);
    if (cont.length > 0) { doMove(cont[0], true); return; }
    return;
  }
  const p = board[r][c];
  if (selected) {
    const move = validMoves.find(m=>m.tr===r&&m.tc===c);
    if (move) { doMove(move, false); return; }
    if (!(p && owner(p)===turn)) { selected=null; validMoves=[]; renderBoard(); return; }
  }
  if (p && owner(p)===turn) {
    const mustJump = mustJumpPieces.length > 0;
    let moves = getMovesFor(board, r, c, mustJump);
    if (mustJump && !mustJumpPieces.includes(`${r},${c}`)) moves = [];
    selected = [r, c];
    validMoves = moves;
    renderBoard();
  }
}

function doMove(move, isContinuation) {
  const {fr, fc, tr, tc, jump, cap} = move;
  const p = board[fr][fc];
  board[tr][tc] = p; board[fr][fc] = null;
  if (cap) board[cap[0]][cap[1]] = null;
  lastMovedFrom = [fr, fc]; lastMovedTo = [tr, tc];
  const promoted = checkPromotion(tr, tc);

  if (jump && !promoted) {
    const cont = getContinuationJumps(board, tr, tc);
    if (cont.length > 0) {
      midJump = {r:tr, c:tc}; selected=[tr,tc]; validMoves=cont;
      renderBoard(); updateUI(); return;
    }
  }

  midJump = null; selected = null; validMoves = [];

  const notation = `${'abcdefgh'[fc]}${8-fr}${jump?'x':'-'}${'abcdefgh'[tc]}${8-tr}`;
  if (turn==='c') moveHistory.push({num:fullMoveNumber, w:notation, b:''});
  else {
    if (moveHistory.length>0) moveHistory[moveHistory.length-1].b = notation;
    else moveHistory.push({num:fullMoveNumber, w:'', b:notation});
    fullMoveNumber++;
  }

  turn = enemy(turn);
  mustJumpPieces = getMustJumpPieces(turn);

  const oppPieces = countPieces(enemy(turn));
  const myMoves = getAllMovesFor(turn);
  if (oppPieces===0 || myMoves.length===0) {
    gameOver = true;
    showGameOver(
      oppPieces===0 ? 'ALL UNITS ELIMINATED' : 'NO MOVES REMAINING',
      turn==='c' ? 'MAGENTA WINS' : 'CYAN WINS'
    );
  }
  renderBoard(); updateUI();
}

function checkPromotion(r, c) {
  if (board[r][c]==='c' && r===0) { board[r][c]='C'; return true; }
  if (board[r][c]==='m' && r===7) { board[r][c]='M'; return true; }
  return false;
}

function countPieces(t) {
  let n=0;
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (board[r][c]&&owner(board[r][c])===t) n++;
  return n;
}

function countKings(t) {
  let n=0;
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) if ((t==='c'&&board[r][c]==='C')||(t==='m'&&board[r][c]==='M')) n++;
  return n;
}

function getAllMovesFor(t) {
  const hasJumps = getMustJumpPieces(t).length > 0;
  const moves = [];
  for (let r=0;r<8;r++) for (let c=0;c<8;c++)
    if (board[r][c]&&owner(board[r][c])===t) moves.push(...getMovesFor(board,r,c,hasJumps));
  return moves;
}

function showGameOver(sub, winner) {
  document.getElementById('gameover-sub').textContent = `// ${sub} //`;
  document.getElementById('gameover-winner').textContent = winner;
  setTimeout(() => document.getElementById('gameover-overlay').classList.add('show'), 500);
}

// ===================== RENDERING =====================

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const selSet = new Set(validMoves.map(m=>`${m.tr},${m.tc}`));
  const capSet = new Set(validMoves.filter(m=>m.jump).map(m=>`${m.tr},${m.tc}`));
  const mustSet = new Set(mustJumpPieces);

  for (let r=0;r<8;r++) {
    for (let c=0;c<8;c++) {
      const sq = document.createElement('div');
      const light = (r+c)%2===0;
      sq.className = 'sq ' + (light?'light':'dark');

      if (!light) {
        if (selected&&selected[0]===r&&selected[1]===c) sq.classList.add('selected');
        else if (capSet.has(`${r},${c}`)) sq.classList.add('valid-capture');
        else if (selSet.has(`${r},${c}`)) sq.classList.add('valid-move');

        if (lastMovedFrom&&lastMovedFrom[0]===r&&lastMovedFrom[1]===c) sq.classList.add('last-move');
        if (lastMovedTo&&lastMovedTo[0]===r&&lastMovedTo[1]===c)       sq.classList.add('last-move');

        const p = board[r][c];
        if (p) {
          const own = owner(p);
          const isSelected = selected&&selected[0]===r&&selected[1]===c;
          const isMustJump = mustSet.has(`${r},${c}`)&&!midJump;
          const chip = document.createElement('div');
          chip.className = `checker ${own==='c'?'p1':'p2'}`;
          if (isSelected) chip.classList.add('selected-piece');
          else if (isMustJump) chip.classList.add('must-jump-piece');
          if (isKing(p)) {
            const crown = document.createElement('span');
            crown.className = 'king-crown';
            crown.textContent = '♛';
            chip.appendChild(crown);
          }
          sq.appendChild(chip);
        }
        sq.addEventListener('click', () => onSquareClick(r, c));
      }
      boardEl.appendChild(sq);
    }
  }

  document.getElementById('rank-coords').innerHTML = '87654321'.split('').map(r=>`<span>${r}</span>`).join('');
  document.getElementById('file-coords').innerHTML  = 'abcdefgh'.split('').map(f=>`<span>${f}</span>`).join('');
}

function updateUI() {
  const statusEl = document.getElementById('status-bar');
  const hasMustJump = mustJumpPieces.length > 0;

  if (!gameOver) {
    const unit = turn==='c' ? 'CYAN' : 'MAGENTA';
    statusEl.textContent = hasMustJump ? `${unit} // MUST JUMP` : `${unit} // MOVE`;
    const col  = turn==='c' ? 'var(--cyan)' : 'var(--magenta)';
    const glow = turn==='c' ? 'var(--glow-cyan)' : 'var(--glow-magenta)';
    statusEl.style.borderColor = col;
    statusEl.style.color = col;
    statusEl.style.textShadow = glow;
    statusEl.style.boxShadow = glow;
  }

  const p1c = countPieces('c'), p1k = countKings('c');
  const p2c = countPieces('m'), p2k = countKings('m');
  const showMust = hasMustJump && !gameOver;
  const p1kings = `♛ ${p1k} KING${p1k!==1?'S':''}`;
  const p2kings = `♛ ${p2k} KING${p2k!==1?'S':''}`;

  // Sync both landscape and portrait panel sets
  ['', 'b'].forEach(sfx => {
    const s = sfx ? '-'+sfx : '';
    const el = id => document.getElementById(id+s);
    if (!el('p1-indicator')) return;
    el('p1-indicator').className = 'active-indicator' + (turn==='c'?' active':'');
    el('p2-indicator').className = 'active-indicator' + (turn==='m'?' active':'');
    el('p1-count').textContent = p1c;
    el('p2-count').textContent = p2c;
    el('p1-kings').textContent = p1kings;
    el('p2-kings').textContent = p2kings;
    el('p1-must').className = 'status-tag' + (showMust&&turn==='c'?' show':'');
    el('p2-must').className = 'status-tag' + (showMust&&turn==='m'?' show':'');
  });

  const logEl = document.getElementById('move-log');
  logEl.innerHTML = moveHistory.map(m =>
    `<span class="move-entry"><span class="num">${m.num}.</span><span class="w">${m.w}</span><span class="b">${m.b}</span></span>`
  ).join('');
  logEl.scrollLeft = logEl.scrollWidth;
}

initGame();
</script>
